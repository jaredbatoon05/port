<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="neonGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#00d2ff"/>
    </linearGradient>
    <radialGradient id="techCircle" cx="50%" cy="50%" r="50%">
      <stop offset="70%" stop-color="#0369a1" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background Base -->
  <rect width="400" height="400" fill="url(#bgGrad)"/>
  <circle cx="200" cy="200" r="160" fill="url(#techCircle)"/>

  <!-- Tech Grid Accent Lines -->
  <circle cx="200" cy="200" r="170" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="6 6" opacity="0.4"/>
  <circle cx="200" cy="200" r="185" fill="none" stroke="#2563eb" stroke-width="1" opacity="0.3"/>

  <!-- Male Silhouette Avatar Graphic -->
  <!-- Head -->
  <circle cx="200" cy="145" r="52" fill="#e2e8f0"/>
  <!-- Hair Tech Accent -->
  <path d="M148,145 C148,100 170,82 200,82 C230,82 252,100 252,145 C250,115 230,96 200,96 C170,96 150,115 148,145 Z" fill="#0f172a"/>

  <!-- Torso & Shoulders -->
  <path d="M110,320 C110,240 150,215 200,215 C250,215 290,240 290,320 Z" fill="#e2e8f0"/>
  <!-- Shirt Collar / Tech Cutout -->
  <path d="M175,215 L200,250 L225,215 Z" fill="#0284c7"/>

  <!-- Cyber Monogram Badge -->
  <g transform="translate(140, 315)">
    <rect width="120" height="34" rx="17" fill="#0f172a" stroke="url(#neonGlow)" stroke-width="2"/>
    <text x="60" y="22" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="14" font-weight="800" fill="#38bdf8" text-anchor="middle" letter-spacing="2">JARED</text>
  </g>
</svg>
